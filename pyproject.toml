[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ehr-intelligence"
version = "0.1.0"
description = "AI-powered EHR Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "EHR Engineering Team" }
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
